name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the loader version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='loader'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match loader version $version" >&2
            exit 1
          fi

      - run: cargo test --release
        env:
          PROPTEST_CASES: "2000"
      - run: cargo build --release -p loader

      - name: Package
        shell: bash
        run: |
          name="ensh-mods-$GITHUB_REF_NAME"
          mkdir "$name"
          cp target/release/powrprof.dll README.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" "$name/powrprof.dll" > SHA256SUMS

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "ensh-mods-$GITHUB_REF_NAME.zip" SHA256SUMS \
            --title "ensh-mods $GITHUB_REF_NAME" --generate-notes
